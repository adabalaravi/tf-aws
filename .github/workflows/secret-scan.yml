name: Secret Scan (Gitleaks)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]



jobs:
  gitleaks-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: "--redact --verbose --config=.gitleaks.toml"
